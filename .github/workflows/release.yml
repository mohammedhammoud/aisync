name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, for example v0.1.0. Leave empty to run Release Please.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.tag || 'auto' }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Open release PR or tag release
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout release PR
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Cargo lock version
        if: steps.release.outputs.prs_created == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          cargo update --manifest-path src-tauri/Cargo.toml -p aisync --precise "$version"

      - name: Commit Cargo lock version
        if: steps.release.outputs.prs_created == 'true'
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore: update cargo lock version"
          git push

  build-macos:
    name: Build macOS DMG
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || inputs.tag != '')
    uses: ./.github/workflows/build-macos.yml
    with:
      tag: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
